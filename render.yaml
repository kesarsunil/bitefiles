services:
  - type: web
    name: byte-sentinel
    runtime: python
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
